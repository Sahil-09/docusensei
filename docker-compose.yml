version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: docusensei-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: docusensei
      POSTGRES_PASSWORD: docusensei123
      POSTGRES_DB: docusensei
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docusensei -d docusensei"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: docusensei-backend
    ports:
      - "4444:4444"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://docusensei:docusensei123@postgres:5432/docusensei
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      FRONTEND_URL: http://localhost:3000
      API_PORT: 4444
      WEBHOOK_SECRET: ${WEBHOOK_SECRET}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
        NEXT_PUBLIC_API_URL: http://localhost:4444/api/v1
    container_name: docusensei-frontend
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
    depends_on:
      - backend

volumes:
  postgres_data:
